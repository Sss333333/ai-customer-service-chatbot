main:
  push:
    - imports:
        - https://cnb.cool/kefu-2026/ai-customer-service-chatbot-key/-/blob/main/github.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Sss333333/ai-customer-service-chatbot.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            push_tags: false
            force: false
